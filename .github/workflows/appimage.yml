# Builds the Linux AppImage when a release is published and attaches it to the release.
# It can also be run by hand for an existing release (Actions → AppImage → Run workflow).
#
# The AppImage carries Siler, its native messaging host (siler-nmhost), the proxy script
# helper (siler-pac), gtk-layer-shell for the tray panel and the bundled FFmpeg
# (scripts/build-ffmpeg.sh). It is built on the oldest supported Ubuntu, so it runs
# on distributions with that glibc or newer. It carries zsync update information, and its
# .zsync file is attached beside it, so AppImage updaters fetch only what changed
# (scripts/appimage-zsync.sh).
name: AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the AppImage to (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CARGO_TERM_COLOR: always
      # Released binaries only: about a fifth smaller, no faster, and over twice the build
      # time, so local release builds keep Cargo.toml's thin LTO.
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file xz-utils patchelf zsync zip \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            libgtk-layer-shell0

      - name: The tag matches the app's version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match the app's version $version (app/src-tauri/tauri.conf.json)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Restore the bundled FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            app/src-tauri/resources/ffmpeg
            app/src-tauri/resources/ffprobe
            app/src-tauri/resources/ffmpeg-LICENSE.txt
          key: ffmpeg-ubuntu-22.04-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build the bundled FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      - name: UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Tests
        env:
          SILER_REQUIRE_FFMPEG: "1"
        run: |
          export SILER_FFMPEG="$PWD/app/src-tauri/resources/ffmpeg"
          cargo test --workspace --locked

      - name: Extension and interface checks
        run: |
          node --test extension/tests/*.test.mjs
          (cd app && pnpm check && node locales/check.mjs)

      - name: The Chromium extension
        run: node scripts/build-extension.mjs chromium

      - name: Helpers, FFmpeg and gtk-layer-shell beside the app
        run: |
          cargo build --release --locked -p siler-nmhost -p siler-pac
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/src-tauri/binaries
          cp target/release/siler-nmhost "app/src-tauri/binaries/siler-nmhost-$triple"
          cp target/release/siler-pac "app/src-tauri/binaries/siler-pac-$triple"
          # The tray panel loads it at run time, so linuxdeploy can't see that it is needed.
          cp -L /usr/lib/x86_64-linux-gnu/libgtk-layer-shell.so.0 app/src-tauri/binaries/libgtk-layer-shell.so.0
          cp /usr/share/doc/libgtk-layer-shell0/copyright app/src-tauri/binaries/gtk-layer-shell-LICENSE
          cp app/src-tauri/resources/ffmpeg "app/src-tauri/binaries/ffmpeg-$triple"
          cp app/src-tauri/resources/ffprobe "app/src-tauri/binaries/ffprobe-$triple"

      - name: The signed extension from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bundled so Settings → Browser → Add to Firefox works without a download.
          gh release download "$TAG" -p 'siler-integration-*.xpi' -O app/src-tauri/resources/siler-integration.xpi --clobber
          unzip -l app/src-tauri/resources/siler-integration.xpi | grep -q 'META-INF/cose.sig' \
            || { echo "::error::The release's siler-integration-*.xpi is not signed by Mozilla"; exit 1; }

      - name: Build the AppImage
        working-directory: app
        run: pnpm tauri build --bundles appimage --config src-tauri/tauri.appimage.json

      - name: Name, update information and checksum
        run: |
          src=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          name="Siler-$VERSION-x86_64.AppImage"
          mkdir -p out
          cp "$src" "out/$name"
          scripts/appimage-zsync.sh "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")

      - name: The tarball (also what the AUR package installs)
        run: |
          cargo build --release --locked -p siler-nmhost -p siler-pac
          tarball=$(scripts/make-tarball.sh app/src-tauri/resources/siler-integration.xpi | tail -n 1)
          cp "$tarball" "$tarball.sha256" out/
          cp "dist/siler-chromium-$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])').zip" out/
          (cd out && sha256sum siler-*.tar.gz siler-chromium-*.zip Siler-*.AppImage > SHA256SUMS)
          ls -l out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber
