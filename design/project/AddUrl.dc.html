<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K-Star — Add download</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC35C}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 680px; height: 760px; box-sizing: border-box; display: grid; place-items: center; background: #07080A; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: #ECEEF2">
<div role="dialog" aria-labelledby="add-title" style="width: 600px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 16px; background: #13161B; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 80px rgba(0,0,0,.55)">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 4px">
<h2 id="add-title" style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em">Add download</h2>
<button aria-label="Close" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: #B0B6C2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 20px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">Address</span>
<span style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 9px; background: #0E1014; border: 1px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent)">
<input class="mono" value="https://releases.ubuntu.com/24.10/ubuntu-24.10-desktop-amd64.iso" spellcheck="false" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #ECEEF2; font-size: 12px">
<span style="font-size: 11px; color: #8B92A0; padding: 3px 7px; border-radius: 6px; background: #1A1E25">Pasted</span>
</span>
</label>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #1A1E25; border: 1px solid rgba(255,255,255,.07)">
<div style="flex: none; width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, #1FB2C8 16%, transparent); color: #1FB2C8">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"></path></svg>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ubuntu-24.10-desktop-amd64.iso</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 3px; font-size: 12px; color: #8B92A0">
<span class="mono" style="color: #ECEEF2">5.70 GB</span>
<span style="display: inline-flex; align-items: center; gap: 5px; color: #3DD68C"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Resumable</span>
<span>Splits into up to 8 connections</span>
<span>releases.ubuntu.com</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">File name</span>
<input value="ubuntu-24.10-desktop-amd64.iso" spellcheck="false" style="height: 38px; padding: 0 12px; border-radius: 9px; background: #0E1014; border: 1px solid rgba(255,255,255,.13); color: #ECEEF2; font: inherit; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">Category</span>
<select style="height: 38px; padding: 0 10px; border-radius: 9px; background: #0E1014; border: 1px solid rgba(255,255,255,.13); color: #ECEEF2; font: inherit">
<option>Programs</option><option>Video</option><option>Music</option><option>Images</option><option>Documents</option><option>Compressed</option><option>Other</option>
</select>
</label>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">Save to</span>
<span style="display: flex; gap: 8px">
<input value="~/Downloads/Programs" spellcheck="false" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 9px; background: #0E1014; border: 1px solid rgba(255,255,255,.13); color: #ECEEF2; font: inherit; outline: none">
<button aria-label="Choose folder" style="width: 40px; height: 38px; display: grid; place-items: center; border-radius: 9px; background: #1A1E25; border: 1px solid rgba(255,255,255,.13); color: #ECEEF2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
</span>
<span style="font-size: 11.5px; color: #8B92A0">58.4 GB free on this drive</span>
</label>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.07)">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-weight: 600; font-size: 12.5px">Options</span>
<span style="font-size: 11.5px; color: #8B92A0">Saved as defaults for releases.ubuntu.com</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">Connections</span>
<div style="display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 4px; border-radius: 9px; background: #0E1014; border: 1px solid rgba(255,255,255,.13)">
<button aria-label="Fewer connections" style="width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: #B0B6C2"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span class="mono" style="font-weight: 600">8</span>
<button aria-label="More connections" style="width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: #B0B6C2"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">Speed limit</span>
<select style="height: 38px; padding: 0 10px; border-radius: 9px; background: #0E1014; border: 1px solid rgba(255,255,255,.13); color: #ECEEF2; font: inherit">
<option>No limit</option><option>10 MB/s</option><option>5 MB/s</option><option>1 MB/s</option><option>Custom…</option>
</select>
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #B0B6C2">If the file already exists</span>
<div role="radiogroup" aria-label="If the file already exists" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #0E1014; border: 1px solid rgba(255,255,255,.1)">
<button role="radio" aria-checked="true" style="height: 30px; border: 0; border-radius: 7px; background: #242932; color: #ECEEF2; font-weight: 600; font-size: 12.5px">Ask</button>
<button role="radio" aria-checked="false" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: #B0B6C2; font-size: 12.5px">Keep both</button>
<button role="radio" aria-checked="false" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: #B0B6C2; font-size: 12.5px">Replace</button>
<button role="radio" aria-checked="false" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: #B0B6C2; font-size: 12.5px">Skip</button>
</div>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.07)">
<span style="margin-right: auto; font-size: 11.5px; color: #8B92A0">Paste several links to add them together</span>
<button style="height: 36px; padding: 0 14px; border-radius: 9px; background: #1A1E25; border: 1px solid rgba(255,255,255,.13); color: #ECEEF2; font-weight: 600">Download later</button>
<button style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 9px; background: var(--accent); border: 0; color: #1A1300; font-weight: 650">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6 9l6 6 6-6M5 21h14"></path></svg>
Start download
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A524","options":["#F5A524","#4C9AFF","#B48CFF","#FF7A59"]},"$preview":{"width":680,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5A524' };
  }
}
</script>
</body>
</html>
