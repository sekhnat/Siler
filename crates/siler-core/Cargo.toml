[package]
name = "siler-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process"] }
siler-media = { path = "../siler-media" }
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-util = "0.7"
futures-util = "0.3"
# Every client is pinned to HTTP/1.1 (`http1_only`) except the HTTP/2 slots in `net.rs`, which
# only range workers use, and only when Settings → Transfers turns them on: one HTTP/2 client
# would multiplex all of a server's connections onto one TCP connection.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "system-proxy", "stream", "socks", "http2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "7"
mime_guess = "2"
percent-encoding = "2"
rustix = { version = "1", features = ["fs", "rand"] }
# sync_file_range (start a range's writeback without waiting), which rustix doesn't wrap.
libc = "0.2"
fastrand = "2"
base64 = "0.22"
httpdate = "1"
digest_auth = "0.3"
jiff = "1"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
crc32fast = "1"
flate2 = "1"
lol_html = "2"
encoding_rs = "0.8"
bytes = "1"
tokio-rustls = "0.26"
rustls-platform-verifier = "0.7"
russh = "0.65"
russh-sftp = "3"
psl = "2.1.261"
hmac = "0.13"
md4 = "0.11"
libloading = "0.9"
hyper-util = { version = "0.1", features = ["client-legacy"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
axum = "0.8"
# The HTTP/2 test server (`h2_tests.rs`).
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
