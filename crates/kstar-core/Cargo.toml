[package]
name = "kstar-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process"] }
kstar-media = { path = "../kstar-media" }
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-util = "0.7"
futures-util = "0.3"
# HTTP/1.1 only on purpose: with HTTP/2 every "connection" would be multiplexed onto a single TCP stream.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "system-proxy", "stream", "socks"] }
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "7"
mime_guess = "2"
percent-encoding = "2"
rustix = { version = "1", features = ["fs"] }
fastrand = "2"
base64 = "0.22"
httpdate = "1"
digest_auth = "0.3"
jiff = "1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
