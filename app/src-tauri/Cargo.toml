[package]
name = "siler"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Siler download manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
siler-core = { path = "../../crates/siler-core" }
url = "2"
siler-ipc = { path = "../../crates/siler-ipc", features = ["tokio"] }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
open = "5.4"
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustix = { version = "1", features = ["process"] }
libc = "0.2"
dirs = "7"
ksni = "0.3.7"
gtk = "0.18"
libloading = "0.9"
tracing-appender = "0.2.5"
tauri-plugin-window-state = "2.5.0"
oo7 = "0.7"
tauri-plugin-drag = "2.1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
tokio-util = "0.7"
percent-encoding = "2"
sha2 = "0.11"
fluent-bundle = "0.16"
unic-langid = "0.9"

[dev-dependencies]
tempfile = "3"
